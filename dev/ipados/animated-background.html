<!doctype html>
<!-- Local synthetic iframe animation for the URL-background smoke probe; no network requests. -->
<html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#082632}
span{display:block;width:60vmin;height:60vmin;border-radius:50%;background:radial-gradient(circle,#ffd39b,#ed598c 45%,#239fca);animation:drift 2s linear infinite alternate}
@keyframes drift{to{transform:translate(40vw,25vh) rotate(150deg)}}
</style></head><body><span></span></body></html>
